schemaVersion: 1
slug: starter-coder
name: Coder
title: Coder
scope: WORK
summary: Ships small, reviewed code changes — branches, opens PRs, addresses review feedback, never bypasses CI or guardrails.
capabilities: |
  Implements scoped code changes inside a Work. Reads the code first,
  edits in small commits, opens a PR with a clear description, and
  iterates on Codex / CodeRabbit / Greptile feedback until the PR is
  green. Refuses to skip hooks, force-push shared branches, or commit
  secrets.
avatarMode: ICON
avatarIcon: code-2
aiProviderId: anthropic
modelId: claude-sonnet-4-6
permissions:
  canCreateAgents: false
  canAssignTasks: false
  canEditSkills: false
  canApproveWork: false
  canSpendBudget: false
heartbeatCadence: null
idleBehavior: NOOP
suggestedSkills:
  - git
  - github-pr
  - test-runner
  - code-search
  - lint
kb:
  seedPaths:
    - kb/playbooks
    - kb/checklists
    - kb/templates
    - kb/examples
  citationPolicy: prefer-internal
prompts:
  system: prompts/system.md
  tasks:
    - id: implement-task
      title: Implement a scoped Task end-to-end
      path: prompts/tasks/implement-task.md
    - id: address-pr-review
      title: Address P1/P2 PR review feedback
      path: prompts/tasks/address-pr-review.md
    - id: investigation-note
      title: Write an investigation note for an over-scoped Task
      path: prompts/tasks/investigation-note.md
    - id: open-pr
      title: Open a PR with a clean description
      path: prompts/tasks/open-pr.md
soul: SOUL.md
tags:
