name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install validators
        run: npm install --no-save ajv ajv-cli ajv-formats yaml js-yaml prettier

      - name: Validate manifest, .works/agent.yml, skills.yml, eval/*.yml
        run: node scripts/validate.js

      - name: Prettier check
        run: npx prettier --check "**/*.{json,yml,yaml,md}" --ignore-path .gitignore || echo "prettier check produced findings (non-blocking)"